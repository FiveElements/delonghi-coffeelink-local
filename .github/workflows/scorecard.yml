# OpenSSF Scorecard : note les pratiques de sécurité du dépôt (protection de branche, actions
# épinglées, permissions des jetons, Dependabot, CodeQL…) et publie le résultat sur
# scorecard.dev, d'où vient le badge du README. Le SARIF remonte aussi dans l'onglet Security.
#
# ⚠️ `publish_results: true` impose des règles strictes à CE workflow : aucune permission en
# écriture au niveau global, pas de `env`/`defaults`, et seules quelques actions sont admises dans
# le job. Ne rien y ajouter d'autre — l'action refuse de publier et le badge reste vide.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # chaque lundi, pour suivre les critères qui évoluent sans commit
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analyse:
    name: Analyse Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # téléverser le SARIF
      id-token: write # signer la publication sur scorecard.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
