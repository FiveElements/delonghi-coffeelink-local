# Release sur étiquette `v*` : publie l'image Docker sur GHCR et crée la release GitHub avec une
# archive utilisable sans Docker.
#
#   git tag -a v0.2.0 -m "…" && git push origin v0.2.0
#
# Rien à configurer : `GITHUB_TOKEN` suffit pour GHCR et pour la release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à publier (doit exister)"
        required: true

permissions:
  contents: write # créer la release
  packages: write # pousser sur ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build et archive
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: meta
        name: Déterminer la version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node_modules/.bin/tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Archive pour une installation sans Docker : il ne reste qu'à faire `pnpm install --prod`
      # et `node server.mjs`. `data/` et `.env.local` en sont volontairement absents.
      - name: Fabriquer l'archive
        run: |
          name="delonghi-lan-server-${{ steps.meta.outputs.version }}"
          mkdir -p "dist/$name"
          cp -r .next src messages public package.json pnpm-lock.yaml pnpm-workspace.yaml \
                next.config.mjs tsconfig.json server.mjs README.md DOCKER.md \
                .env.local.example "dist/$name/"
          # ⚠️ `public/` n'est PAS embarqué dans `.next` : Next le sert depuis le disque à
          # chaque requête. Oublié ici, l'archive se décompresse, `node server.mjs` démarre,
          # l'interface s'affiche — et les 58 dessins de boisson et 7 visuels de grain rendent
          # 404 en silence. Même oubli que l'étape `runtime` du Dockerfile, même coût. On
          # l'atteste ici plutôt que de le découvrir chez celui qui installe.
          for attendu in boissons/espresso.webp grains/torrefaction-1.png; do
            if [ ! -s "dist/$name/public/$attendu" ]; then
              echo "::error::l'archive ne transporte pas public/$attendu"
              exit 1
            fi
          done
          echo "visuels embarqués : $(find "dist/$name/public" -type f | wc -l) fichiers"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ls -lh dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/*.tar.gz
          retention-days: 7

  image:
    name: Image Docker multi-architecture
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ⚠️ `github.repository` porte le nom de l'organisation TEL QU'IL EST ÉCRIT — ici
      # `FiveElements`. Docker refuse un nom de dépôt qui n'est pas entièrement en minuscules :
      # « invalid tag … repository name must be lowercase ». L'échec arrive APRÈS le build Next,
      # au moment de pousser, donc après une vingtaine de minutes d'émulation arm64. Les
      # expressions GitHub n'ont pas d'opérateur de minuscules : d'où ce passage par $GITHUB_ENV,
      # qui réécrit `IMAGE` pour toutes les étapes suivantes du job.
      - name: Le nom de l'image, en minuscules
        run: echo "IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # arm64 est construit sous émulation QEMU : c'est lent (le build Next domine), mais ça évite
      # d'avoir à maintenir un runner ARM. Le cache GHA rattrape le coût d'une release à l'autre.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: Calculer les étiquettes d'image
        run: |
          v="${{ needs.build.outputs.version }}"
          major="${v%%.*}"
          minor="${v%.*}"
          echo "list=${{ env.IMAGE }}:${v},${{ env.IMAGE }}:${minor},${{ env.IMAGE }}:${major},${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"

      - name: Construire et pousser
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=De'Longhi LAN Server
            org.opencontainers.image.description=Serveur LAN mode Ayla pour piloter une machine De'Longhi ECAM en local
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=NOASSERTION

  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    needs: [build, image]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ⚠️ `github.repository` porte le nom de l'organisation TEL QU'IL EST ÉCRIT — ici
      # `FiveElements`. Docker refuse un nom de dépôt qui n'est pas entièrement en minuscules :
      # « invalid tag … repository name must be lowercase ». L'échec arrive APRÈS le build Next,
      # au moment de pousser, donc après une vingtaine de minutes d'émulation arm64. Les
      # expressions GitHub n'ont pas d'opérateur de minuscules : d'où ce passage par $GITHUB_ENV,
      # qui réécrit `IMAGE` pour toutes les étapes suivantes du job.
      - name: Le nom de l'image, en minuscules
        run: echo "IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      - name: Rédiger les notes
        id: notes
        run: |
          v="${{ needs.build.outputs.version }}"
          prev=$(git describe --tags --abbrev=0 "v${v}^" 2>/dev/null || echo "")
          {
            echo "## Installation"
            echo
            echo '```bash'
            echo "docker run -d --name delonghi-lan-server \\"
            echo "  -p 3000:3000 -v lan-server-data:/data \\"
            echo "  -e MACHINE_IP=<ip de la cafetiere> -e SERVER_IP=<ip de l hote> \\"
            echo "  -e LANIP_KEY=... -e LANIP_KEY_ID=... \\"
            echo "  ${{ env.IMAGE }}:${v}"
            echo '```'
            echo
            echo "Options de configuration : voir [DOCKER.md](DOCKER.md)."
            echo "⚠️ \`SERVER_IP\` doit être joignable depuis le VLAN de la cafetière, et le port doit être identique des deux côtés."
            echo
            echo "## Changements"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..v${v}"
            else
              git log --no-merges --pretty='- %s' -20
            fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: v${{ needs.build.outputs.version }}
          body_path: notes.md
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
